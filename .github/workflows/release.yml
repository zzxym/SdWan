name: SDWAN Release

on:
  workflow_dispatch:
    inputs:
      core_run_id:
        description: 'The run id of SDWAN-Core Action in SDWAN repo'
        type: number
        required: true
      gui_run_id:
        description: 'The run id of SDWAN-GUI Action in SDWAN repo'
        type: number
        required: true
      mobile_run_id:
        description: 'The run id of SDWAN-Mobile Action in SDWAN repo'
        type: number
        required: true
      version:
        description: 'Version for this release'
        type: string
        default: 'sdwan-v2.6.4'
        required: true
      make_latest:
        description: 'Mark this release as latest'
        type: boolean
        default: true
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5

      - name: Download Core Artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ inputs.core_run_id }}
          repo: ${{ github.repository }}
          path: release_assets

      - name: Download GUI Artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ inputs.gui_run_id }}
          repo: ${{ github.repository }}
          path: release_assets_nozip

      - name: Download Mobile Artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ inputs.mobile_run_id }}
          repo: ${{ github.repository }}
          path: release_assets_nozip

      - name: Zip release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir zipped_assets

          find release_assets_nozip -type f -exec mv {} zipped_assets \;
          ls -l -R ./zipped_assets

          cd release_assets
          ls -l -R ./
          chmod -R 755 .
          for x in `ls`; do
            if [ "$x" = "SDWAN-Magisk" ]; then
              # for SDWAN-Magisk, make sure files are in the root of the zip
              cd $x;
              zip -r ../../zipped_assets/$x-${VERSION}.zip .;
              cd ..;
            elif [ "$x" = "sdwan-web-binaries" ] || [ "$x" = "sdwan-web-dashboard" ]; then
              continue
            else
              zip -r ../zipped_assets/$x-${VERSION}.zip $x;
            fi
          done

      - name: Zip web assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd release_assets
          if [ -d sdwan-web-binaries ]; then
            (
              cd sdwan-web-binaries
              if [ -f sdwan-web ]; then
                zip -r ../../zipped_assets/sdwan-web-${VERSION}.zip sdwan-web
              fi
              if [ -f sdwan-web-embed ]; then
                zip -r ../../zipped_assets/sdwan-web-embed-${VERSION}.zip sdwan-web-embed
              fi
            )
          fi
          if [ -d sdwan-web-dashboard ]; then
            (cd sdwan-web-dashboard && zip -r ../../zipped_assets/sdwan-web-dashboard-${VERSION}.zip .)
          fi

      - name: Write VERSION index
        env:
          VERSION: ${{ inputs.version }}
        run: printf '%s\n' "$VERSION" > VERSION

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.version }}
          draft: false
          make_latest: ${{ inputs.make_latest }}
          files: |
            ./VERSION
            ./zipped_assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.version }}
