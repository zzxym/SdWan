[workspace]
resolver = "2"
members = [
    "sdwan",
    "sdwan-gui/src-tauri",
    "sdwan-rpc-build",
    "sdwan-web",
    "sdwan-contrib/sdwan-ffi",
    "sdwan-contrib/sdwan-uptime",
    "sdwan-contrib/sdwan-android-jni",
]
default-members = ["sdwan", "sdwan-web"]
exclude = [
    "sdwan-contrib/sdwan-ohrs", # it needs ohrs sdk
]

[workspace.package]
edition = "2024"
rust-version = "1.95"

[profile.dev]
panic = "unwind"
debug = 2

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
strip = true

# 外部源码依赖统一使用 zzxym 远程仓库（git URL 声明于各 crate 的 Cargo.toml）
